[project]
name = "docuparse"
version = "0.1.0"
description = "Lightweight Document Intelligence REST API for Spanish business documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pillow>=10.0",
    "pydantic>=2.7",
    "paddlepaddle>=3.2",
    "paddleocr[doc-parser]>=3.3",
]

[project.optional-dependencies]
fast = [
    "onnxruntime>=1.30.0",
    "pypdfium2>=5.14.0",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuparse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
