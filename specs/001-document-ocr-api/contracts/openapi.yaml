openapi: 3.0.3
info:
  title: DocuParse API
  version: 0.1.0
  description: Synchronous document intelligence API for Spanish business documents.
paths:
  /ocr:
    post:
      summary: Extract structured information from a PDF or image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, PNG or JPEG/JPG, up to 10 MB (PDF up to 20 pages)
      responses:
        '200':
          description: Extraction result (also returned for readable documents with no content)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /health:
    get:
      summary: Service health
      responses:
        '200':
          description: Ready to process documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    OcrResponse:
      type: object
      required: [document, pages, warnings]
      properties:
        document: { $ref: '#/components/schemas/DocumentInfo' }
        pages:
          type: array
          items: { $ref: '#/components/schemas/PageResult' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
    DocumentInfo:
      type: object
      required: [file_name, file_type, size_bytes, page_count, processing_time_ms]
      properties:
        file_name: { type: string }
        file_type: { type: string, enum: [pdf, png, jpeg] }
        size_bytes: { type: integer }
        page_count: { type: integer }
        processing_time_ms: { type: integer }
    PageResult:
      type: object
      required: [page_number, status, width, height, text, elements, tables, formulas, charts, warnings]
      properties:
        page_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [processed, failed] }
        width: { type: integer }
        height: { type: integer }
        text: { type: string }
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        tables:
          type: array
          items: { $ref: '#/components/schemas/Table' }
        formulas:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        charts:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
    BoundingBox:
      type: object
      required: [left, top, right, bottom]
      properties:
        left: { type: number }
        top: { type: number }
        right: { type: number }
        bottom: { type: number }
    Element:
      type: object
      required: [type, bbox, reading_order, text, confidence]
      properties:
        type: { type: string, enum: [text, table, formula, chart, other] }
        bbox: { $ref: '#/components/schemas/BoundingBox' }
        reading_order: { type: integer, minimum: 1 }
        text: { type: string, nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
    Table:
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                type: array
                items: { $ref: '#/components/schemas/Cell' }
    Cell:
      type: object
      required: [text, row_span, col_span]
      properties:
        text: { type: string }
        row_span: { type: integer, minimum: 1 }
        col_span: { type: integer, minimum: 1 }
    Warning:
      type: object
      required: [code, message, page_number]
      properties:
        code: { type: string, enum: [no_content_detected, low_quality_page, page_failed] }
        message: { type: string }
        page_number: { type: integer, nullable: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - missing_file
                - multiple_files
                - file_too_large
                - too_many_pages
                - unsupported_file_type
                - unreadable_file
                - processing_failed
                - service_not_ready
                - processing_timeout
                - not_found
                - method_not_allowed
                - bad_request
            message: { type: string }
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [healthy, not_ready] }
        service: { type: string }
        version: { type: string }
